name: Publish Kick package (testnet)
on: workflow_dispatch
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Sui CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/suiup" install sui@testnet -y
      - name: Publish to testnet
        env:
          KICK_DEPLOYER_KEY: ${{ secrets.KICK_DEPLOYER_KEY }}
          # Public address of the funded testnet wallet (not a secret).
          EXPECTED_ADDRESS: "0x745c455dbb94ea713c13c8d3cf9c7c6b80cf7a78eb86c710a378087297657f97"
        run: |
          set -euo pipefail

          # Runs a Sui command and prints its output. Key material and recovery phrases are removed before printing.
          # Error text goes to stdout in some CLI versions, so output is always shown, never hidden.
          show() {
            local out status
            set +e
            out=$("$@" 2>&1)
            status=$?
            set -e
            echo "$out" | sed -E 's/suiprivkey[0-9a-zA-Z]+/[redacted]/g' | grep -viE 'phrase|mnemonic' | tail -n 25 || true
            if [ "$status" -ne 0 ]; then
              echo "STOPPED: the command '$1' failed (see output above)."
              exit 1
            fi
          }

          echo "Step 1/5: check the secret is present"
          if [ -z "${KICK_DEPLOYER_KEY:-}" ]; then
            echo "STOPPED: secret KICK_DEPLOYER_KEY is missing or empty."
            exit 1
          fi
          echo "present"

          echo "Step 2/5: create the CLI config (answers the setup prompts; output hidden because it prints a throwaway phrase)"
          printf 'y\nhttps://fullnode.testnet.sui.io:443\nkick-testnet\n0\n' | sui client envs >/dev/null 2>&1 || true
          if [ ! -f "$HOME/.sui/sui_config/client.yaml" ]; then
            echo "STOPPED: the CLI config was not created at $HOME/.sui/sui_config/client.yaml"
            exit 1
          fi
          echo "config present"

          echo "Step 3/5: import the funded key into the keystore"
          show sui keytool import "$KICK_DEPLOYER_KEY" ed25519
          # The config prompt does not always create the named environment, so add it explicitly (no key material involved).
          sui client new-env --alias kick-testnet --rpc https://fullnode.testnet.sui.io:443 >/dev/null 2>&1 || true
          show sui client switch --env kick-testnet

          echo "Step 4/5: confirm the key is the funded wallet"
          ADDRS=$(sui keytool list --json 2>/dev/null | jq -r '.[].suiAddress' || true)
          echo "Addresses in keystore (public):"
          echo "$ADDRS"
          if ! echo "$ADDRS" | grep -qx "$EXPECTED_ADDRESS"; then
            echo "STOPPED: the secret is not the funded wallet $EXPECTED_ADDRESS. Replace the secret with that wallet's key and re-run."
            exit 1
          fi
          show sui client switch --address "$EXPECTED_ADDRESS"
          ACTIVE=$(sui client active-address 2>/dev/null | tr -d '[:space:]' || true)
          if [ "$ACTIVE" != "$EXPECTED_ADDRESS" ]; then
            echo "STOPPED: active address is $ACTIVE, expected $EXPECTED_ADDRESS."
            exit 1
          fi
          COINS=$(sui client gas "$EXPECTED_ADDRESS" --json 2>/dev/null || echo "[]")
          if ! echo "$COINS" | jq -e 'type=="array" and length>0' >/dev/null 2>&1; then
            echo "STOPPED: wallet $EXPECTED_ADDRESS holds no testnet SUI. Fund it at faucet.sui.io and re-run."
            exit 1
          fi
          echo "Funded: $(echo "$COINS" | jq 'length') SUI coin(s)"

          echo "Step 5/5: publish the Kick package"
          cd move/kick
          set +e
          sui client publish --gas-budget 200000000 --json > out.txt 2>&1
          PSTATUS=$?
          set -e
          if [ "$PSTATUS" -ne 0 ]; then
            sed -E 's/suiprivkey[0-9a-zA-Z]+/[redacted]/g' out.txt | tail -n 60
            echo "STOPPED: publish failed (output above)."
            exit 1
          fi
          sed -n '/^{/,$p' out.txt > pub.json
          PKG=$(jq -r '.objectChanges[] | select(.type=="published") | .packageId' pub.json)
          FAUCET=$(jq -r '.objectChanges[] | select(.type=="created") | select(.objectType|endswith("::kick_token::Faucet")) | .objectId' pub.json)
          ADMIN=$(jq -r '.objectChanges[] | select(.type=="created") | select(.objectType|endswith("::rounds::AdminCap")) | .objectId' pub.json)
          if [ -z "$PKG" ] || [ "$PKG" = "null" ]; then
            echo "STOPPED: could not read the package ID from the publish output."
            exit 1
          fi
          echo "KICK_PACKAGE_ID=$PKG"
          echo "KICK_FAUCET_ID=$FAUCET"
          echo "KICK_ADMIN_CAP_ID=$ADMIN"
          {
            echo "### Kick (testnet)"
            echo "- Package: \`$PKG\`"
            echo "- Faucet (shared): \`$FAUCET\`"
            echo "- AdminCap: \`$ADMIN\`"
          } >> "$GITHUB_STEP_SUMMARY"
